[package]
name = "pdf-splitter"
version = "1.0.0"
edition = "2024"
description = "Split PDF files with a friendly GUI"
license = "MIT"
publish = false

[[bin]]
name = "PDF-Splitter"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
lopdf = { version = "0.47.0", default-features = false }
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.winresource]
ProductName = "PDF Splitter"
FileDescription = "PDF Splitter"
OriginalFilename = "PDF-Splitter.exe"
