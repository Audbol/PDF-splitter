name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build portable EXE
        run: cargo build --release

      - name: Show EXE details
        shell: pwsh
        run: |
          $exe = "target/release/PDF-Splitter.exe"
          if (-not (Test-Path $exe)) { throw "EXE not built" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Splitter-windows
          path: target/release/PDF-Splitter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PDF Splitter ${{ inputs.release_tag || github.ref_name }}
          files: target/release/PDF-Splitter.exe
          generate_release_notes: true
          body: |
            ## Download

            **[PDF-Splitter.exe](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag || github.ref_name }}/PDF-Splitter.exe)**: a single portable file. There's nothing to install; just download and run it.

            Windows SmartScreen may warn on first launch because the exe isn't code-signed. Click **More info → Run anyway**.

            ## Features

            - Split modes: every page, every N pages, equal parts, custom ranges (`1-3, 5, 8-last`) and extract pages into one file
            - Drag and drop, live preview of the output file names, light/dark/system theme
            - Password-protected PDFs (RC4/AES), progress bar with cancel, never overwrites existing files unless asked
