name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean pdf_splitter.spec

      - name: Check EXE was produced
        shell: pwsh
        run: |
          $exe = "dist/PDF-Splitter.exe"
          if (-not (Test-Path $exe)) { throw "EXE not built" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Splitter-windows
          path: dist/PDF-Splitter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF-Splitter.exe
          generate_release_notes: true
